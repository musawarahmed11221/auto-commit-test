name: 5-Minute Test Commit

on:
  schedule:
    # This runs every 5 minutes (the fastest allowed by GitHub Actions)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Keeps the manual trigger button available

permissions:
  contents: write

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Update testing log
        run: |
          mkdir -p bot
          echo "Test run at: $(date)" > bot/test-log.txt
          
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot/test-log.txt
          git commit -m "chore: 5-minute test commit" --allow-empty
          git push
